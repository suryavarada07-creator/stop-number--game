<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop the Number</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <!-- Game title -->
        <h1>🎯 STOP THE NUMBER</h1>

        <!-- Target number -->
        <div class="target-box">
            TARGET NUMBER:
            <span id="targetNumber">68</span>
        </div>

        <!-- Main number -->
        <div class="number-box">
            <span id="currentNumber">1</span>
        </div>

        <!-- Game message -->
        <div id="message" class="message">
            Set your target and press START!
        </div>

        <!-- Target settings -->
        <div class="settings">
            <label for="targetInput">Set Target Number</label>

            <div class="target-controls">
                <input type="number" id="targetInput" min="1" max="100" value="68">

                <button id="saveTarget">SAVE</button>
            </div>
        </div>

        <!-- Main buttons -->
        <div class="buttons">

            <button id="startBtn" class="start-btn">
                ▶ START
            </button>

            <button id="stopBtn" class="stop-btn" disabled>
                ⏹ STOP
            </button>

        </div>

        <!-- New Game -->
        <button id="newGameBtn" class="new-game-btn">
            🔄 NEW GAME
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
