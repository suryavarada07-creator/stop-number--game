<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Stop at 10.00</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">

        <h1>🎯 STOP AT 10.00</h1>

        <p class="instruction">
            Stop the timer exactly at <strong>10.00</strong>
            to win the offer!
        </p>

        <div class="timer-box">
            <span id="timer">00.00</span>
        </div>

        <div id="message" class="message">
            Press START to begin
        </div>

        <div class="buttons">

            <!-- ONE BUTTON ONLY -->
            <button id="startStopBtn" class="start-btn">
                ▶ START
            </button>

        </div>

        <button id="resetBtn" class="reset-btn">
            🔄 RESET
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
